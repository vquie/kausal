name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "*.*.*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build, Release and Publish Image
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Compute image metadata
        id: image
        shell: bash
        run: |
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          repo="$(echo "${GITHUB_REPOSITORY#*/}" | tr '[:upper:]' '[:lower:]')"
          raw_tag="${GITHUB_REF_NAME}"
          version="${raw_tag#v}"

          if [[ ! "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Tag '$raw_tag' is not supported. Expected v<major>.<minor>.<patch> or <major>.<minor>.<patch>."
            exit 1
          fi

          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"

          {
            echo "name=ghcr.io/${owner}/${repo}"
            echo "version=$version"
            echo "major=$major"
            echo "minor=$minor"
            echo "prefixed_version=v$version"
          } >> "${GITHUB_OUTPUT}"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=v${{ steps.image.outputs.version }}
            type=raw,value=v${{ steps.image.outputs.major }}.${{ steps.image.outputs.minor }}
            type=raw,value=v${{ steps.image.outputs.major }}
            type=raw,value=${{ steps.image.outputs.version }}
            type=raw,value=${{ steps.image.outputs.major }}.${{ steps.image.outputs.minor }}
            type=raw,value=${{ steps.image.outputs.major }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Kausal
            org.opencontainers.image.description=Local-first Kubernetes visualization for understanding cluster relationships
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}#readme
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
          annotations: |
            org.opencontainers.image.title=Kausal
            org.opencontainers.image.description=Local-first Kubernetes visualization for understanding cluster relationships
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}#readme
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          VERSION: ${{ steps.image.outputs.version }}
          MAJOR: ${{ steps.image.outputs.major }}
          MINOR: ${{ steps.image.outputs.minor }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            --method POST \
            -f "tag_name=${GITHUB_REF_NAME}" \
            --jq .body > release-notes.md

          printf '\n' >> release-notes.md
          cat >> release-notes.md <<EOF
          ## Container image tags

          - \`${IMAGE_NAME}:v${VERSION}\`
          - \`${IMAGE_NAME}:v${MAJOR}.${MINOR}\`
          - \`${IMAGE_NAME}:v${MAJOR}\`
          - \`${IMAGE_NAME}:${VERSION}\`
          - \`${IMAGE_NAME}:${MAJOR}.${MINOR}\`
          - \`${IMAGE_NAME}:${MAJOR}\`
          - \`${IMAGE_NAME}:latest\`

          ## Multi-arch

          - \`linux/amd64\`
          - \`linux/arm64\`

          ## Digest

          \`${IMAGE_DIGEST}\`
          EOF

          gh release create "${GITHUB_REF_NAME}" --verify-tag --notes-file release-notes.md
