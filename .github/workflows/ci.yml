name: CI

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "24"

jobs:
  application:
    name: Application
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        id: node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install locked dependencies
        id: install
        run: npm ci

      - name: Audit production dependencies
        if: ${{ !cancelled() && steps.node.outcome == 'success' }}
        run: npm audit --package-lock-only --omit=dev --audit-level=high

      - name: Type-check and build server and client
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build

  lint:
    name: Repository lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run MegaLinter
        uses: oxsecurity/megalinter@9949bad031045f366be2467e00e8371a7328a2e2 # v10.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIP_CLI_LINT_MODES: project
          VALIDATE_ALL_CODEBASE: true

  container:
    name: Container
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build production image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          # Refresh runtime OS packages even when the pinned base image is unchanged.
          no-cache-filters: runtime
          load: true
          push: false
          tags: kausal:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for fixable high-severity vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kausal:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          version: v0.76.0

      - name: Smoke-test application container
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          trap 'docker rm --force kausal-ci >/dev/null 2>&1 || true' EXIT
          docker run --detach --name kausal-ci \
            --publish 127.0.0.1:18080:8080 \
            kausal:ci

          # The health API requires Kubernetes; static assets can be tested without a cluster.
          ready=false
          for _ in {1..30}; do
            if curl --fail --silent --show-error --max-time 5 \
              http://127.0.0.1:18080/ --output /tmp/kausal-index.html; then
              ready=true
              break
            fi
            sleep 1
          done
          if [[ "${ready}" != "true" ]]; then
            docker logs kausal-ci
            exit 1
          fi

          python3 - <<'PYTHON'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.request import urlopen

          class AssetParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.assets = []

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == "script" and attrs.get("src"):
                      self.assets.append(attrs["src"])
                  if tag == "link" and attrs.get("rel") == "stylesheet" and attrs.get("href"):
                      self.assets.append(attrs["href"])

          parser = AssetParser()
          parser.feed(Path("/tmp/kausal-index.html").read_text())
          if not parser.assets:
              raise SystemExit("The application page contains no built assets")
          for asset in parser.assets:
              if not asset.startswith("/assets/"):
                  raise SystemExit(f"Unexpected asset path: {asset}")
              with urlopen(f"http://127.0.0.1:18080{asset}", timeout=10) as response:
                  if "text/html" in response.headers.get("Content-Type", "") or not response.read():
                      raise SystemExit(f"Missing or invalid built asset: {asset}")
          PYTHON

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime
          license-check: true
          deny-licenses: AGPL-1.0-only, AGPL-1.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later

  merge-gate:
    name: Merge gate
    if: always()
    needs:
      - application
      - lint
      - container
      - dependency-review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every applicable check to pass
        env:
          APPLICATION_RESULT: ${{ needs.application.result }}
          EVENT_NAME: ${{ github.event_name }}
          LINT_RESULT: ${{ needs.lint.result }}
          CONTAINER_RESULT: ${{ needs.container.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
        shell: bash
        run: |
          failed=0
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            if [[ "${DEPENDENCY_REVIEW_RESULT}" != "success" ]]; then
              failed=1
            fi
          elif [[ "${DEPENDENCY_REVIEW_RESULT}" != "skipped" ]]; then
            failed=1
          fi
          for check in \
            "Application:${APPLICATION_RESULT}" \
            "Repository lint:${LINT_RESULT}" \
            "Container:${CONTAINER_RESULT}"; do
            name="${check%%:*}"
            result="${check#*:}"
            printf '%-24s %s\n' "${name}" "${result}"
            if [[ "${result}" != "success" ]]; then
              failed=1
            fi
          done
          printf '%-24s %s\n' "Dependency review" "${DEPENDENCY_REVIEW_RESULT}"
          exit "${failed}"
